name: smart_docs_generator
description: "Smart Documentation Generator — upload a project ZIP and generate professional docs with a multi-agent AI pipeline."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Immutable models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ZIP handling, file IO
  archive: ^3.6.1
  file_picker: ^8.0.6
  desktop_drop: ^0.4.4
  path: ^1.9.0
  path_provider: ^2.1.3
  cross_file: ^0.3.4+2

  # Networking (AI providers)
  dio: ^5.5.0+1

  # Secure local storage (API keys)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Markdown rendering
  flutter_markdown: ^0.7.3+1

  # PDF export
  pdf: ^3.11.1
  printing: ^5.13.1

  # Crypto / encryption helpers
  crypto: ^3.0.3

  # Misc
  uuid: ^4.4.0
  collection: ^1.18.0
  intl: ^0.19.0

  # Typography
  google_fonts: ^6.2.1

  # Links
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.4

flutter_launcher_icons:
  image_path: "assets/logo.png"

  android: true
  adaptive_icon_foreground: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"

  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#1976D2"

  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/